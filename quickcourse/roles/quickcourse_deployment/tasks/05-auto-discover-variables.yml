---
# Auto-discover OpenShift credentials before validation runs.
# Priority:
#   1. Derive API URL from openshift_cluster_console_url
#   2. varnames scan for any *openshift_api_key* or *openshift_bearer_token* var
#   3. oc login with admin + common_admin_password → token
#   4. OAuth token via uri module (works without oc in runner)
#   5. Existing oc session fallback
# All steps are non-blocking.

- name: Auto-discover OpenShift credentials
  when:
    - quickcourse_deployment_ocp | default('no') in ['yes', 'true', true, 'Yes', 'YES']
  block:

    # ----------------------------------------------------------------
    # Step 0a: derive API URL from openshift_cluster_console_url
    # console: https://console-openshift-console.apps.<cluster>
    # api:     https://api.<cluster>:6443
    # ----------------------------------------------------------------
    - name: Derive API URL from openshift_cluster_console_url
      ansible.builtin.set_fact:
        quickcourse_openshift_api_url: >-
          https://api.{{ openshift_cluster_console_url
            | regex_replace('^https?://[^.]+\.apps\.', '')
            | regex_replace('/$', '') }}:6443
      when:
        - openshift_cluster_console_url | default('') | length > 0
        - quickcourse_openshift_api_url | default('') | length == 0
      failed_when: false
      ignore_errors: true

    # ----------------------------------------------------------------
    # Step 1: scan playbook variable scope for any *openshift_api_key*
    #         or *openshift_bearer_token* variable (exclude internal ones)
    # ----------------------------------------------------------------
    - name: Find extra-vars matching openshift key pattern
      ansible.builtin.set_fact:
        _discovered_key_vars: >-
          {{ q('varnames', 'openshift_api_key|openshift_bearer_token')
             | reject('match', '^quickcourse_') | list }}
      failed_when: false
      ignore_errors: true

    - name: Find extra-vars matching openshift URL pattern
      ansible.builtin.set_fact:
        _discovered_url_vars: >-
          {{ q('varnames', 'openshift_api_url|openshift_api_server')
             | reject('match', '^quickcourse_') | list }}
      failed_when: false
      ignore_errors: true

    - name: Set quickcourse_openshift_api_key from first matching extra-var
      ansible.builtin.set_fact:
        quickcourse_openshift_api_key: "{{ lookup('vars', _discovered_key_vars[0]) }}"
      when:
        - _discovered_key_vars | default([]) | length > 0
        - quickcourse_openshift_api_key | default('') | length == 0
      failed_when: false
      ignore_errors: true

    - name: Set quickcourse_openshift_api_url from first matching extra-var
      ansible.builtin.set_fact:
        quickcourse_openshift_api_url: "{{ lookup('vars', _discovered_url_vars[0]) }}"
      when:
        - _discovered_url_vars | default([]) | length > 0
        - quickcourse_openshift_api_url | default('') | length == 0
      failed_when: false
      ignore_errors: true

    # ----------------------------------------------------------------
    # Step 2: oc login with admin + common_admin_password → token
    # ----------------------------------------------------------------
    - name: Login with username and common_admin_password via oc
      when:
        - quickcourse_openshift_api_key | default('') | length == 0
        - quickcourse_openshift_api_url | default('') | length > 0
        - common_admin_password | default('') | length > 0
      block:
        - name: oc login with admin credentials
          ansible.builtin.command: >
            oc login {{ quickcourse_openshift_api_url }}
            --username={{ openshift_username | default('admin') }}
            --password={{ common_admin_password }}
            --insecure-skip-tls-verify=true
          register: _oc_login_result
          changed_when: false
          failed_when: false
          ignore_errors: true
          no_log: true

        - name: Get token after oc login
          ansible.builtin.command: oc whoami --show-token
          register: _oc_token_after_login
          changed_when: false
          failed_when: false
          ignore_errors: true
          when: _oc_login_result.rc | default(1) == 0

        - name: Set token from oc login
          ansible.builtin.set_fact:
            quickcourse_openshift_api_key: "{{ _oc_token_after_login.stdout | trim }}"
          when:
            - _oc_login_result.rc | default(1) == 0
            - _oc_token_after_login.stdout | default('') | trim | length > 0

    # ----------------------------------------------------------------
    # Step 3: OAuth token via uri module (works without oc in runner)
    # ----------------------------------------------------------------
    - name: Get token via OpenShift OAuth API (no oc required)
      when:
        - quickcourse_openshift_api_key | default('') | length == 0
        - quickcourse_openshift_api_url | default('') | length > 0
        - common_admin_password | default('') | length > 0
      block:
        - name: Derive OAuth endpoint from API URL
          ansible.builtin.set_fact:
            _oauth_host: >-
              oauth-openshift.apps.{{ quickcourse_openshift_api_url
                | regex_replace('^https://api\.', '')
                | regex_replace(':6443$', '') }}
          failed_when: false
          ignore_errors: true

        - name: Request OAuth token via HTTP
          ansible.builtin.uri:
            url: "https://{{ _oauth_host }}/oauth/authorize?response_type=token&client_id=openshift-challenging-client"
            method: GET
            user: "{{ openshift_username | default('admin') }}"
            password: "{{ common_admin_password }}"
            force_basic_auth: true
            validate_certs: false
            follow_redirects: none
            headers:
              X-CSRF-Token: "1"
            status_code: [200, 302, 301, 401, 403]
          register: _oauth_response
          failed_when: false
          ignore_errors: true
          no_log: true

        - name: Extract token from OAuth redirect Location header
          ansible.builtin.set_fact:
            quickcourse_openshift_api_key: >-
              {{ _oauth_response.location
                 | regex_search('access_token=([^&]+)', '\1')
                 | first }}
          when:
            - _oauth_response.location is defined
            - "'access_token=' in _oauth_response.location"
          failed_when: false
          ignore_errors: true

    # ----------------------------------------------------------------
    # Step 4: fall back to existing oc session
    # ----------------------------------------------------------------
    - name: Generate token from oc session (fallback)
      when: quickcourse_openshift_api_key | default('') | length == 0
      block:
        - name: Get OpenShift API URL from oc
          ansible.builtin.command: oc whoami --show-server
          register: _oc_server
          changed_when: false
          failed_when: false
          ignore_errors: true

        - name: Get OpenShift token from oc
          ansible.builtin.command: oc whoami --show-token
          register: _oc_token
          changed_when: false
          failed_when: false
          ignore_errors: true

        - name: Set credentials from oc session
          ansible.builtin.set_fact:
            quickcourse_openshift_api_url: "{{ _oc_server.stdout | trim }}"
            quickcourse_openshift_api_key: "{{ _oc_token.stdout | trim }}"
          when:
            - _oc_server.rc | default(1) == 0
            - _oc_token.rc | default(1) == 0
            - _oc_server.stdout | default('') | trim | length > 0
            - _oc_token.stdout | default('') | trim | length > 0

    - name: Debug resolved credentials
      ansible.builtin.debug:
        msg: >-
          OpenShift credentials resolved —
          source={{ _discovered_key_vars[0] | default('password-auth') }},
          api={{ quickcourse_openshift_api_url | default('(not set)') }}
        verbosity: 1
      when: quickcourse_openshift_api_key | default('') | length > 0
