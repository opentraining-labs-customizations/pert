---
# -----------------------------------------------------------------------
# Deploy Quick Course to OpenShift
# -----------------------------------------------------------------------

- name: Set become to false for all OpenShift tasks
  set_fact:
    ansible_become: false

- name: Validate OpenShift credentials are provided
  become: false
  assert:
    that:
      - quickcourse_openshift_api_url | length > 0
      - quickcourse_openshift_api_key | length > 0
    fail_msg: |
      ERROR: OpenShift API credentials are required!

      Please provide via extra-vars (command line):
        -e "openshift_api_url=https://api.cluster-xxxxx.example.com:6443"
        -e "openshift_api_key=sha256~your-token-here"

      Or via YAML vars file/playbook:
        openshift_api_url: https://api.cluster-xxxxx.example.com:6443
        openshift_api_key: sha256~your-token-here

      Alternative variable names are also supported:
        openshift_api_server_url: https://...
        openshift_token: sha256~...
        openshift_cluster_admin_token: eyJhbGci...

      Optional parameters:
        openshift_api_ca_cert: /path/to/ca.crt (or certificate content as string)
        openshift_validate_certs: false (to skip certificate validation)
    success_msg: "OpenShift API: {{ quickcourse_openshift_api_url }}"

- name: Create OpenShift namespace
  kubernetes.core.k8s:
    host: "{{ quickcourse_openshift_api_url }}"
    api_key: "{{ quickcourse_openshift_api_key }}"
    validate_certs: false
    ca_cert: "{{ quickcourse_openshift_api_ca_cert }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ quickcourse_ocp_namespace }}"

- name: Build variable injection lines for antora-playbook.yml
  set_fact:
    quickcourse_var_lines: []
  when: quickcourse_collected_vars | default({}) | length == 0

- name: Build variable injection lines when variables exist
  set_fact:
    quickcourse_var_lines: "{{ quickcourse_var_lines | default([]) + ['    ' + item.key + ': \"' + item.value | string | replace('\"', '\\\"') + '\"'] }}"
  loop: "{{ quickcourse_collected_vars | default({}) | dict2items }}"
  when: quickcourse_collected_vars | default({}) | length > 0

- name: Split variables into chunks to avoid ConfigMap size limit
  set_fact:
    _configmap_size_limit: 1048576
    _chunk_size_target: 900000
    _all_var_lines: "{{ quickcourse_var_lines | default([]) }}"

- name: Build variable chunks using Python
  set_fact:
    _var_chunks: "{{ _var_chunks | default([]) }}"
  vars:
    _var_chunks: |
      {%- set chunks = [] -%}
      {%- set current_chunk = [] -%}
      {%- set current_size = 0 -%}
      {%- for line in _all_var_lines -%}
        {%- set line_size = (line + '\n') | length -%}
        {%- if (current_size + line_size) > _chunk_size_target and current_chunk | length > 0 -%}
          {%- set _ = chunks.append(current_chunk) -%}
          {%- set current_chunk = [line] -%}
          {%- set current_size = line_size -%}
        {%- else -%}
          {%- set _ = current_chunk.append(line) -%}
          {%- set current_size = current_size + line_size -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if current_chunk | length > 0 -%}
        {%- set _ = chunks.append(current_chunk) -%}
      {%- endif -%}
      {{ chunks }}

- name: Create ConfigMaps for variable chunks
  kubernetes.core.k8s:
    host: "{{ quickcourse_openshift_api_url }}"
    api_key: "{{ quickcourse_openshift_api_key }}"
    validate_certs: false
    ca_cert: "{{ quickcourse_openshift_api_ca_cert }}"
    state: present
    namespace: "{{ quickcourse_ocp_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "quickcourse-vars-{{ chunk_idx }}"
        namespace: "{{ quickcourse_ocp_namespace }}"
      data:
        variables.txt: "{{ item | join('\n') }}"
  loop: "{{ _var_chunks }}"
  loop_control:
    index_var: chunk_idx
    label: "chunk-{{ chunk_idx }}"
  when:
    - _var_chunks | length > 0
    - (item | join('\n')) | length > 0

- name: Set primary ConfigMap fact (for backward compatibility)
  set_fact:
    quickcourse_asciidoc_attributes: "{{ (_var_chunks[0] | default([])) | join('\n') }}"
  when: _var_chunks | length > 0

- name: Set ConfigMap count
  set_fact:
    quickcourse_vars_configmap_count: "{{ _var_chunks | length }}"

- name: Set volume mounts for init container
  set_fact:
    _init_volume_mounts:
      - name: app
        mountPath: /app
      - name: build
        mountPath: /build

- name: Add ConfigMap volume mounts if variables exist
  set_fact:
    _init_volume_mounts: "{{ _init_volume_mounts + [{'name': 'quickcourse-vars-' + (item | string), 'mountPath': '/var/quickcourse/' + (item | string)}] }}"
  loop: "{{ range(0, quickcourse_vars_configmap_count | default(0) | int) | list }}"
  when: quickcourse_vars_configmap_count | default(0) | int > 0

- name: Set volumes list
  set_fact:
    _pod_volumes:
      - name: app
        emptyDir: {}
      - name: build
        emptyDir: {}

- name: Add ConfigMap volumes if variables exist
  set_fact:
    _pod_volumes: "{{ _pod_volumes + [{'name': 'quickcourse-vars-' + (item | string), 'configMap': {'name': 'quickcourse-vars-' + (item | string)}}] }}"
  loop: "{{ range(0, quickcourse_vars_configmap_count | default(0) | int) | list }}"
  when: quickcourse_vars_configmap_count | default(0) | int > 0

- name: Create Quick Course Pod with variable injection
  kubernetes.core.k8s:
    host: "{{ quickcourse_openshift_api_url }}"
    api_key: "{{ quickcourse_openshift_api_key }}"
    validate_certs: false
    ca_cert: "{{ quickcourse_openshift_api_ca_cert }}"
    state: present
    namespace: "{{ quickcourse_ocp_namespace }}"
    definition:
      apiVersion: v1
      kind: Pod
      metadata:
        name: quickcourse
        labels:
          app: quickcourse
      spec:
        initContainers:
        - name: builder
          image: "{{ quickcourse_ocp_builder_image }}"
          securityContext:
            runAsUser: 0
          command: ["/bin/bash"]
          args:
          - -xec
          - >-
            dnf install -y git &&
            rm -rf /build/* /build/.* 2>/dev/null || true &&
            cd /build &&
            git clone {{ quickcourse_git_repo }} . &&
            {% if quickcourse_git_ref != 'main' %}
            git checkout {{ quickcourse_git_ref }} &&
            {% endif %}
            {% if quickcourse_vars_configmap_count | default(0) | int > 0 %}
            echo "=== Merging {{ quickcourse_vars_configmap_count }} ConfigMap chunks ===" &&
            cat /var/quickcourse/*/variables.txt > /tmp/vars.txt 2>/dev/null || true &&
            if [ -s /tmp/vars.txt ]; then
              echo "" >> /tmp/vars.txt &&
              awk '/^  attributes:$/ {print; system("cat /tmp/vars.txt"); next} 1' antora-playbook.yml > /tmp/playbook.yml &&
              mv /tmp/playbook.yml antora-playbook.yml &&
              rm -f /tmp/vars.txt &&
              echo "=== Variables Injected ===" &&
              tail -30 antora-playbook.yml
            else
              echo "=== No variables found in ConfigMaps, skipping variable injection ==="
            fi &&
            {% else %}
            echo "=== No variables to inject ===" &&
            {% endif %}
            npm install &&
            npm run build &&
            cp -r build/site/* /app/ &&
            echo "=== Build Complete ===" &&
            ls -la /app/
          volumeMounts: "{{ _init_volume_mounts }}"
        containers:
        - name: nginx
          image: "{{ quickcourse_ocp_webserver_image }}"
          ports:
          - containerPort: 80
          volumeMounts:
          - name: app
            mountPath: /usr/share/nginx/html
        volumes: "{{ _pod_volumes }}"

- name: Create Service for Quick Course
  kubernetes.core.k8s:
    host: "{{ quickcourse_openshift_api_url }}"
    api_key: "{{ quickcourse_openshift_api_key }}"
    validate_certs: false
    ca_cert: "{{ quickcourse_openshift_api_ca_cert }}"
    state: present
    namespace: "{{ quickcourse_ocp_namespace }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: quickcourse
        labels:
          app: quickcourse
      spec:
        selector:
          app: quickcourse
        ports:
        - protocol: TCP
          port: 80
          targetPort: 80

- name: Create Route for Quick Course
  kubernetes.core.k8s:
    host: "{{ quickcourse_openshift_api_url }}"
    api_key: "{{ quickcourse_openshift_api_key }}"
    validate_certs: false
    ca_cert: "{{ quickcourse_openshift_api_ca_cert }}"
    state: present
    namespace: "{{ quickcourse_ocp_namespace }}"
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: quickcourse
      spec:
        to:
          kind: Service
          name: quickcourse
        port:
          targetPort: 80
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect

- name: Wait for pod to be running
  kubernetes.core.k8s_info:
    host: "{{ quickcourse_openshift_api_url }}"
    api_key: "{{ quickcourse_openshift_api_key }}"
    validate_certs: false
    ca_cert: "{{ quickcourse_openshift_api_ca_cert }}"
    kind: Pod
    name: quickcourse
    namespace: "{{ quickcourse_ocp_namespace }}"
  register: quickcourse_pod_info
  until:
  - quickcourse_pod_info.resources | length > 0
  - quickcourse_pod_info.resources[0].status.phase == "Running"
  retries: 60
  delay: 10

- name: Get Route URL
  kubernetes.core.k8s_info:
    host: "{{ quickcourse_openshift_api_url }}"
    api_key: "{{ quickcourse_openshift_api_key }}"
    validate_certs: false
    ca_cert: "{{ quickcourse_openshift_api_ca_cert }}"
    kind: Route
    name: quickcourse
    namespace: "{{ quickcourse_ocp_namespace }}"
  register: quickcourse_route_info

- name: Set Quick Course URL fact
  set_fact:
    quickcourse_primary_view_url: "https://{{ quickcourse_route_info.resources[0].spec.host }}/"

- name: Display ConfigMap distribution
  debug:
    msg: |
      ========================================
      ConfigMap Distribution
      ========================================
      Total ConfigMaps: {{ quickcourse_vars_configmap_count | default(0) }}
      {% if quickcourse_vars_configmap_count | default(0) | int > 0 %}
      Chunk sizes (bytes):
      {% for chunk in _var_chunks %}
      - Chunk {{ loop.index0 }}: {{ (chunk | join('\n')) | length }} bytes
      {% endfor %}
      {% endif %}
  when: quickcourse_collected_vars | default({}) | length > 0

- name: Display Quick Course deployment summary
  debug:
    msg: |
      ========================================
      Quick Course Deployment Complete!
      ========================================

      Quick Course URL: {{ quickcourse_primary_view_url }}
      Namespace: {{ quickcourse_ocp_namespace }}

      Variables injected: {{ quickcourse_collected_vars.keys() | list | length }} variables
      ConfigMaps created: {{ quickcourse_vars_configmap_count | default(0) }}
      ========================================
